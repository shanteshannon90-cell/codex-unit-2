<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 06</title>
  </head>
  <body>
    <h1>Level 06 — Radios & Checkboxes</h1>
    <form>
      <!-- TODO: Add radio inputs that share a name attribute -->
      <!-- TODO: Add one or more checkbox inputs -->
      <fieldset>
        <legend>Select your favorite fruit:</legend>

        <label
          >Apple
          <input type="radio" name="fruit" value="apple" />
        </label>

        <label
          >Orange
          <input type="radio" name="fruit" value="orange" />
        </label>

        <label
          >Strawberry
          <input type="radio" name="fruit" value="strawberry" />
        </label>

        <label
          >Watermelon
          <input type="radio" name="fruit" value="watermelon" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Choose your favorite pizza toppings:</legend>

        <label
          >Cheese
          <input type="checkbox" name="toppings" value="cheese" />
        </label>

        <label
          >Pepperoni
          <input type="checkbox" name="toppings" value="pepperoni" />
        </label>

        <label
          >Sausage
          <input type="checkbox" name="toppings" value="sausage" />
        </label>

        <label
          >Pineapple
          <input type="checkbox" name="toppings" value="pineapple" />
        </label>
      </fieldset>
    </form>
  </body>
</html>
