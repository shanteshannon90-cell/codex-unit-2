<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 07</title>
  </head>
  <body>
    <h1>Level 07 — Labels & Accessibility</h1>
    <form>
      <!-- TODO: Attach labels to controls. Use <label for="id"> or wrap the input inside <label>. -->
      <label for="Username">Username</label>
      <input type="text" id="name" />

      <label for="emailAddress">Email</label>
      <input type="email" id="email" />

      <label for="telephoneNumber">Telephone Number</label>
      <input type="tel" id="telephone" />

      <label for="password">Password</label>
      <input type="password" id="password" required />

      <label for="number">Number</label>
      <input type="number" min="0" max="10" />

      <label for="range">Range</label><input type="range" min="0" max="100" />

      <label for="file">File</label>
      <input type="file" id="file" />

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
