<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 07</title>
  </head>
  <body>
    <h1>Level 07 — Labels & Accessibility</h1>
    <form>
      <!-- TODO: Attach labels to controls. Use <label for="id"> or wrap the input inside <label>. -->
      <label for="Username">Username < input type="text" id="name" /> </label>

      <label for="emailAddress"
        >Email
        <input type="email" id="email" />
      </label>

      <label for="telephoneNumber"
        >Telephone Number
        <input type="tel" id="telephone" />
      </label>

      <label for="password"
        >Password
        <input type="password" id="password" required />
      </label>

      <label for="number"
        >Number
        <input type="number" min="0" max="10" />
      </label>

      <label for="range"
        >Range
        <input type="range" min="0" max="100" />
      </label>

      <label for="file"
        >File
        <input type="file" id="file" />
      </label>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
