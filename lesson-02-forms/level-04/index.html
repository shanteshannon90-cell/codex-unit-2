<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 04</title>
  </head>
  <body>
    <h1>Level 04 — Input Types</h1>
    <form>
      <!-- TODO: Add inputs using types: email, tel, password, number, range, file -->
      <label
        >Username
        <input type="text" id="name" />
      </label>

      <label
        >Email
        <input type="email" id="email" />
      </label>

      <label
        >Telephone Number
        <input type="tel" id="telephone" />
      </label>

      <label
        >Password
        <input type="password" id="password" required />
      </label>

      <label
        >Number
        <input type="number" min="0" max="10" />
      </label>

      <label
        >Range
        <input type="range" min="0" max="100" />
      </label>

      <label
        >File
        <input type="file" id="file" />
      </label>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
