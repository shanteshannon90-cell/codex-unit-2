<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 10</title>
  </head>
  <body>
    <h1>Level 10 — Debugging & Fixing Common Mistakes</h1>
    <form>
      <!-- TODO: Fix common mistakes such as missing ids for labels, duplicate ids, or missing submit control -->
      <h2>Contact Form</h2>
      <label for="firstname">First Name</label>
      <input type="text" id="name" /><br />

      <label for="lastname">Last Name</label>
      <input type="text" id="name" /><br />

      <label for="telephone">Telephone Number</label>
      <input type="tel" id="telephone" /><br />

      <label for="ageRange">Age</label>
      <input type="range" min="13" max="99" /><br />

      <label for="email">Email</label>
      <input type="email" id="email" /><br />

      <label for="password">Password</label>
      <input type="password" required minlength="4" maxlength="12" /><br />

      <label for="filechoice">Choose File</label>
      <input type="file" id="file" /><br />

      <button label for="button" type="submit">Submit</button>
    </form>
  </body>
</html>
