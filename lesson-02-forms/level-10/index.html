<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 10</title>
  </head>
  <body>
    <h1>Level 10 — Debugging & Fixing Common Mistakes</h1>
    <form>
      <!-- TODO: Fix common mistakes such as missing ids for labels, duplicate ids, or missing submit control -->
      <h2>Contact Form</h2>
      <label for="firstname"
        >First Name<input type="text" id="firstName" /><br />
      </label>

      <label for="lastname"
        >Last Name<input type="text" id="lastName" /><br
      /></label>

      <label for="telephone"
        >Telephone Number<input type="tel" id="telephone" /><br
      /></label>

      <label for="ageRange"
        >Age<input type="range" min="13" max="99" /><br
      /></label>

      <label for="email">Email<input type="email" id="email" /><br /></label>

      <label for="password"
        >Password<input
          type="password"
          required
          minlength="4"
          maxlength="12"
        /><br />
      </label>

      <label for="filechoice"
        >Choose File<input type="file" id="file" /><br
      /></label>

      <button label for="button" type="submit">Submit</button>
    </form>
  </body>
</html>
