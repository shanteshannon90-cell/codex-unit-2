<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 09</title>
  </head>
  <body>
    <h1>Level 09 — Basic Validation</h1>
    <form>
      <!-- TODO: Add required attributes and minlength/maxlength where appropriate -->
      <!-- TODO: If using a range input, include min and max -->
      <label for="password">Password
        <input
        id="password"
        type="password"
        name="password"
        required
        minlength="4"
        maxlength="10"
      />
    </label>
      
      <label for="range">Age Range
        <input id ="range type="range" min="1" max="75" />
      </label>
      
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
