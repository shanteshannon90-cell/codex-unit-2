<!-- Level 8 starter: Details & Summary -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details starter</title>
  </head>
  <body>
    <h1>More Info</h1>
    <details>
      <summary>See More</summary>
      <p>
        The detail tag provides a drop button that reveals a message not
        displayed on the screen.
      </p>
    </details>
  </body>
</html>
